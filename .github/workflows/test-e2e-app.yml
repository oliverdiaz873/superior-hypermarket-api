name: Test E2E GitHub App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-app:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: superior-hypermarket-e2e

      - name: Verify E2E repository access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api /repos/${{ github.repository_owner }}/superior-hypermarket-e2e \
            --jq '{full_name: .full_name, private: .private}'

      - name: Verify Actions permission
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api /repos/${{ github.repository_owner }}/superior-hypermarket-e2e/actions/workflows/e2e.yml \
            --jq '{name: .name, path: .path, state: .state}'
